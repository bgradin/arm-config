services:
  arm:
    build:
      context: .
      dockerfile: arm/Dockerfile
    image: arm:local
    container_name: arm
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      ARM_UID: "${ARM_UID}"
      ARM_GID: "${ARM_GID}"
      NVIDIA_DRIVER_CAPABILITIES: "all"
      TV_DATA: /var/lib/tv
      TV_INBOX: /home/arm/media/completed/tv
      TV_LIBRARY: /home/arm/media/completed/tv
      TV_CAPTURE_MENU_ASSETS: "${TV_CAPTURE_MENU_ASSETS:-false}"

    gpus: all

    volumes:
      - "${ARM_HOME}:/home/arm"
      - "${ARM_MEDIA}:/home/arm/media"
      - "${ARM_MUSIC}:/home/arm/Music"
      - "${ARM_LOGS}:/home/arm/logs"
      - "${ARM_CONFIG}:/etc/arm/config"
      - "./arm/arm.yaml:/etc/arm/config/arm.yaml:ro"
      - "${ARM_MEDIA}/.tv:/var/lib/tv"

    devices:
      - "/dev/sr0:/dev/sr0"
      - "/dev/sg2:/dev/sg2"

    privileged: true

  tv:
    build:
      context: .
      dockerfile: tv/Dockerfile
    image: arm-tv:local
    container_name: arm-tv
    restart: unless-stopped
    user: "${ARM_UID}:${ARM_GID}"
    ports:
      - "${TV_PORT:-8081}:8081"
    environment:
      TV_DATA: /var/lib/tv
      TV_INBOX: /home/arm/media/completed/tv
      TV_LIBRARY: /home/arm/media/completed/tv
      TV_BIND: 0.0.0.0
      TV_PORT: 8081
      TV_WORKER: "true"
      TV_HASH_ASSETS: "${TV_HASH_ASSETS:-true}"
      TV_AUTH_TOKEN: "${TV_AUTH_TOKEN:-}"
      TMDB_READ_TOKEN: "${TMDB_READ_TOKEN:-}"
      JELLYFIN_EPISODE_VERSIONS: "${JELLYFIN_EPISODE_VERSIONS:-false}"
      TZ: "${TZ:-America/Los_Angeles}"
    volumes:
      - "${ARM_MEDIA}/completed/tv:/home/arm/media/completed/tv"
      - "${ARM_MEDIA}/.tv:/var/lib/tv"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
